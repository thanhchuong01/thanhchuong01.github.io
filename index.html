<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon-16x16.png">
    <link rel="manifest" href="./assets/site.webmanifest">
</head>

<body>
    <div id="countdown" class="countdown jaro-font">
        <div class="countdown-box ">
            <div class="day time-box ">
                <div id="days-num"></div>
            </div>
            <div class="days-text time-unit">ngày</div>
        </div>
        <div class="countdown-box">
            <div class="hour time-box ">
                <div id="hours-num"></div>
            </div>
            <div class="hours-text time-unit">giờ</div>
        </div>
        <div class="countdown-box">
            <div class="minute time-box ">
                <div id="minutes-num"></div>
            </div>
            <div class="minutes-text time-unit">phút</div>
        </div>
        <div class="countdown-box">
            <div class="second time-box ">
                <div id="seconds-num"></div>
            </div>
            <div class="seconds-text time-unit">giây</div>
        </div>
       
    </div>
    <div class="text montserrat-font ephesis-regular">Xuân Bính Ngọ</div>
  <iframe
    id="bg-music"
    width="0"
    height="0"
    src="https://www.youtube.com/embed/yPZqgNQwous?autoplay=1&mute=1&enablejsapi=1"
    frameborder="0"
    allow="autoplay"
></iframe>
   <button id="mute-btn" class="mute-btn">🔇</button>
    <script src="script.js"></script>
</body>

</html>
